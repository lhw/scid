# =============================================================================
# Build and push all SCID container images to ghcr.io
# =============================================================================
# Runs on every push to main and on semver tags (v*).
# Images are pushed to ghcr.io/example/scid/<name>.
#
# Required secrets (set in Forgejo repository settings → Secrets):
#   REGISTRY_USERNAME         — registry login (Forgejo username or token name)
#   REGISTRY_PASSWORD         — registry password or access token
#
# Required variables (set in Forgejo repository settings → Variables):
#   PUBLIC_POCKET_ID_URL      — e.g. https://id.scid.my   (baked into frontend bundle)
#   PUBLIC_OIDC_CLIENT_ID     — OIDC client ID            (baked into frontend bundle)
#   PUBLIC_TURNSTILE_SITE_KEY — Cloudflare Turnstile site key, empty to disable
#                               (public value — safe as a variable, not a secret)
# =============================================================================

name: Build Container Images

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/example/scid

jobs:
  # ---------------------------------------------------------------------------
  # companion  (includes the embedded SvelteKit frontend)
  # Build context is the repo root so the Dockerfile can access frontend/.
  # PUBLIC_* vars are baked into the JS bundle at this stage.
  # ---------------------------------------------------------------------------
  companion:
    name: Companion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/companion
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./companion/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_POCKET_ID_URL=${{ vars.PUBLIC_POCKET_ID_URL }}
            PUBLIC_OIDC_CLIENT_ID=${{ vars.PUBLIC_OIDC_CLIENT_ID }}
            PUBLIC_TURNSTILE_SITE_KEY=${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/companion:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/companion:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # caddy  (custom build with replace-response + cloudflare-dns plugins)
  # ---------------------------------------------------------------------------
  caddy:
    name: Caddy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/caddy
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          file: ./caddy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/caddy:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/caddy:buildcache,mode=max
