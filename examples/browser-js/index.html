<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCID Browser JS Example</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #0a0e1a; color: #e2e8f0; }
    body  { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 1.5rem; }
    h1    { font-size: 1.5rem; margin: 0; color: #00d4ff; }
    p     { margin: 0; color: #e2e8f0aa; font-size: 0.9rem; text-align: center; max-width: 360px; }
    button {
      background: #00d4ff22; border: 1px solid #00d4ff66; color: #00d4ff;
      padding: 0.6rem 1.4rem; border-radius: 8px; cursor: pointer; font-size: 1rem;
      transition: background 0.15s;
    }
    button:hover { background: #00d4ff44; }
  </style>
</head>
<body>
  <h1>SCID Browser JS Example</h1>
  <p>A minimal demo of PKCE-based OIDC authentication with SCID — no server required.</p>
  <button id="login">Sign in with SCID</button>

  <script src="app.js"></script>
  <script>
    document.getElementById('login').addEventListener('click', startLogin);
  </script>
</body>
</html>
