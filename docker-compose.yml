version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Pocket ID — the OIDC provider
  # ---------------------------------------------------------------------------
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      TRUST_PROXY: "true"
      # Uncomment if using PostgreSQL instead of SQLite:
      # DB_PROVIDER: postgres
      # DB_CONNECTION_STRING: postgres://pocket-id:${POSTGRES_PASSWORD}@db:5432/pocket-id
    volumes:
      - pocket-id-data:/app/data
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # SCID Companion Service — RSI verification + helper API
  # ---------------------------------------------------------------------------
  companion:
    build:
      context: ./companion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: /data/scid.db
      POCKET_ID_INTERNAL_URL: http://pocket-id:3000
      POCKET_ID_ADMIN_API_KEY: ${POCKET_ID_ADMIN_API_KEY}
    volumes:
      - companion-data:/data
    networks:
      - internal
    depends_on:
      - pocket-id

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy with automatic HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - pocket-id
      - companion

volumes:
  pocket-id-data:
  companion-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
