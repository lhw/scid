services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — companion database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scid
      POSTGRES_USER: scid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scid -d scid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Pocket ID — the OIDC provider
  # ---------------------------------------------------------------------------
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    restart: unless-stopped
    environment:
      APP_URL: https://id.scid.my
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # Pocket ID can be switched to PostgreSQL if desired.
      # DB_PROVIDER: postgres
      # DB_CONNECTION_STRING: postgres://pocket-id:${POSTGRES_PASSWORD}@postgres:5432/pocket-id
    volumes:
      - pocket-id-data:/app/data
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # SCID Companion Service — RSI verification + helper API
  # ---------------------------------------------------------------------------
  companion:
    image: ghcr.io/example/scid/companion:latest
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://scid:${POSTGRES_PASSWORD}@postgres:5432/scid?sslmode=disable
      POCKET_ID_INTERNAL_URL: http://pocket-id:1411
      POCKET_ID_ADMIN_API_KEY: ${POCKET_ID_ADMIN_API_KEY}
      PUBLIC_POCKET_ID_URL: https://id.scid.my
      PUBLIC_OIDC_CLIENT_ID: ${PUBLIC_OIDC_CLIENT_ID}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - companion-data:/data
    networks:
      - internal
    depends_on:
      - postgres
      - pocket-id
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy with automatic Let's Encrypt TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: ghcr.io/example/scid/caddy:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - pocket-id
      - companion
    healthcheck:
      # Caddy's admin API is available on localhost:2019 by default
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:2019/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  pocket-id-data:
  companion-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
