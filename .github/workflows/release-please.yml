# =============================================================================
# Release Please — automated changelog + versioning + release tags
# =============================================================================
# On every push to main, release-please either:
#   1. Opens/updates a "Release v…" PR with an updated CHANGELOG.md and bumped
#      package.json version (controlled by conventional commits), or
#   2. Drafts a Forgejo release + creates a semver tag when that PR is merged.
#
# Tagging triggers the build workflow (build.yml) which pushes container images.
#
# Required secret (Forgejo repository settings → Secrets):
#   RELEASE_PLEASE_TOKEN — a Forgejo personal access token with
#                          "Contents" (write) and "Pull requests" (write) scopes
# =============================================================================

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Open or update the release PR for any unreleased conventional commits.
      - name: Create or update release PR
        run: |
          npx --yes release-please@16 release-pr \
            --token="${{ secrets.RELEASE_PLEASE_TOKEN }}" \
            --repo-url="lhw/scid" \
            --api-url="https://github.com/api/v1" \
            --graphql-url="https://github.com/api"

      # If a release PR was just merged, create the Forgejo release + tag.
      - name: Create Forgejo release
        run: |
          npx --yes release-please@16 github-release \
            --token="${{ secrets.RELEASE_PLEASE_TOKEN }}" \
            --repo-url="lhw/scid" \
            --api-url="https://github.com/api/v1" \
            --graphql-url="https://github.com/api"
