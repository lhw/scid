services:
  # ---------------------------------------------------------------------------
  # Pocket ID — the OIDC provider
  # ---------------------------------------------------------------------------
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    restart: unless-stopped
    environment:
      APP_URL: https://id.scid.my
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Uncomment if using PostgreSQL instead of SQLite:
      # DB_PROVIDER: postgres
      # DB_CONNECTION_STRING: postgres://pocket-id:${POSTGRES_PASSWORD}@db:5432/pocket-id
    volumes:
      - pocket-id-data:/app/data
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # SCID Companion Service — RSI verification + helper API
  # ---------------------------------------------------------------------------
  companion:
    build:
      context: ./companion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: /data/scid.db
      POCKET_ID_INTERNAL_URL: http://pocket-id:3000
      POCKET_ID_ADMIN_API_KEY: ${POCKET_ID_ADMIN_API_KEY}
    volumes:
      - companion-data:/data
    networks:
      - internal
    depends_on:
      - pocket-id

  # ---------------------------------------------------------------------------
  # SvelteKit frontend — dev server (Vite HMR)
  # ---------------------------------------------------------------------------
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      # Tell the Vite dev proxy where the companion lives inside the stack
      VITE_API_BASE: http://companion:8080
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - internal
    depends_on:
      - companion

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy with static mkcert TLS (local dev)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - pocket-id
      - companion
      - frontend

volumes:
  pocket-id-data:
  companion-data:
  caddy-data:
  caddy-config:
  frontend-node-modules:

networks:
  internal:
    driver: bridge
