services:
  # ---------------------------------------------------------------------------
  # Pocket ID — the OIDC provider
  # ---------------------------------------------------------------------------
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    restart: unless-stopped
    environment:
      APP_URL: https://dev-auth.scid.my
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # Uncomment if using PostgreSQL instead of SQLite:
      # DB_PROVIDER: postgres
      # DB_CONNECTION_STRING: postgres://pocket-id:${POSTGRES_PASSWORD}@db:5432/pocket-id
    volumes:
      - pocket-id-data:/app/data
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # SCID Companion Service — RSI verification + helper API
  # ---------------------------------------------------------------------------
  companion:
    build:
      context: ./companion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: /data/scid.db
      POCKET_ID_INTERNAL_URL: http://pocket-id:1411
      POCKET_ID_ADMIN_API_KEY: ${POCKET_ID_ADMIN_API_KEY}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: https://dev.scid.my,http://localhost:5173
      PUBLIC_OIDC_CLIENT_ID: ${PUBLIC_OIDC_CLIENT_ID}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - companion-data:/data
    networks:
      - internal
    depends_on:
      - pocket-id
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # SvelteKit frontend — dev server (Vite HMR)
  # ---------------------------------------------------------------------------
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      # Tell the Vite dev proxy where the companion lives inside the stack
      VITE_API_BASE: http://companion:8080
      # OIDC client config baked into the SvelteKit bundle at build/dev time
      PUBLIC_POCKET_ID_URL: https://dev-auth.scid.my
      PUBLIC_OIDC_CLIENT_ID: 3f8bd72a-4ae6-4656-83cd-44f0f159b4d5
      # Cloudflare Turnstile site key — empty string disables the widget
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - internal
    depends_on:
      - companion

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy with static mkcert TLS (local dev)
  # ---------------------------------------------------------------------------
  caddy:
    build:
      context: ./caddy
      dockerfile_inline: |
        FROM caddy:2-builder AS builder
        RUN xcaddy build --with github.com/caddyserver/replace-response --with github.com/caddy-dns/cloudflare
        FROM caddy:2-alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - pocket-id
      - companion
      - frontend

volumes:
  pocket-id-data:
  companion-data:
  caddy-data:
  caddy-config:
  frontend-node-modules:

networks:
  internal:
    driver: bridge
